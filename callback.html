<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KuroBeat Auth</title>
</head>
<body style="background-color: #121212; color: #1DB954; font-family: sans-serif; text-align: center; margin-top: 20%;">
  <h2>Возврат к KuroBeat...</h2>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const code = urlParams.get('code');
    const state = urlParams.get('state'); // Здесь лежит IP-адрес ESP32

    if (code && state) {
      // Динамически подставляем IP-адрес устройства
      window.location.href = "http://" + state + "/callback?code=" + code;
    } else {
      document.body.innerHTML = "<h2 style='color: #d32f2f;'>Ошибка: Код или IP не найден.</h2>";
    }
  </script>
</body>
</html>
